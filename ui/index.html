<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Studio</title>

<!-- Application chrome. Each theme is a set of CSS variables (the same in every Studio app). -->
<style>
:root,[data-theme="dark"]{
  --font-ui:"Segoe UI",system-ui,-apple-system,sans-serif;
  --bg:#1b1b1b;--chrome:#2b2b2b;--chrome2:#323232;--panel:#262626;--line:#111;--border:#3c3c3c;--hover:#3e3e3e;
  --text:#d6d6d6;--dim:#949494;--strong:#fff;--accent:#378ef0;--accent2:#2680eb;--on-accent:#fff;
  --cta:#2680eb;--cta-hover:#1473e6;--cta-radius:12px;--btn-radius:13px;--radius:4px;
  --editor-bg:#1e1e1e;--editor-fg:#e3e3e3;--selection:#264f78;--input-bg:#1e1e1e;--input-border:#4a4a4a;
  --pane-head:#232323;--workarea:#2a2a2a;--workarea-dark:#121212;--dd-bg:#303030;--dd-border:#474747;
  --dd-hover-bg:#2680eb;--dd-hover-fg:#fff;--card-bg:#2d2d2d;--card-border:#393939;--code-bg:#1b1b1b;
  --tab-bg:#262626;--tab-active:#1e1e1e;--tab-ind:inset 0 2px #378ef0;--dock-ind:#e8e8e8;
  --seg-bg:#1e1e1e;--seg-active:#4b4b4b;--btn-active-bg:#1c1c1c;--btn-active-border:#555;
  --thumb:#4a4a4a;--thumb-hover:#5c5c5c;--shadow:0 10px 28px rgba(0,0,0,.55);
  --paper-bg:#fff;--paper-line:#d4d4d4;--paper-border:none;--paper-radius:0;
  --paper-shadow:0 0 0 1px rgba(0,0,0,.45),0 8px 30px rgba(0,0,0,.45);
  --switch-off:#5a5a5a;--modal-bg:#2c2c2c;--overlay:rgba(0,0,0,.55);--ok:#2d9d78;--warn:#e68619;--danger:#d7373f;
  color-scheme:dark}
[data-theme="light"]{
  --font-ui:"Segoe UI",system-ui,-apple-system,sans-serif;
  --bg:#e8e8e8;--chrome:#f8f8f8;--chrome2:#efefef;--panel:#f5f5f5;--line:#cacaca;--border:#dcdcdc;--hover:#e1e1e1;
  --text:#323232;--dim:#6e6e6e;--strong:#000;--accent:#1473e6;--accent2:#1473e6;--on-accent:#fff;
  --cta:#1473e6;--cta-hover:#0d66d0;--cta-radius:12px;--btn-radius:13px;--radius:4px;
  --editor-bg:#fff;--editor-fg:#1f1f1f;--selection:#b5d5fb;--input-bg:#fff;--input-border:#b3b3b3;
  --pane-head:#f0f0f0;--workarea:#d9d9d9;--workarea-dark:#5a5a5a;--dd-bg:#fff;--dd-border:#d0d0d0;
  --dd-hover-bg:#1473e6;--dd-hover-fg:#fff;--card-bg:#fff;--card-border:#dedede;--code-bg:#f2f2f2;
  --tab-bg:#e9e9e9;--tab-active:#fff;--tab-ind:inset 0 2px #1473e6;--dock-ind:#323232;
  --seg-bg:#fff;--seg-active:#dadada;--btn-active-bg:#fff;--btn-active-border:#b3b3b3;
  --thumb:#c2c2c2;--thumb-hover:#a8a8a8;--shadow:0 8px 24px rgba(0,0,0,.18);
  --paper-bg:#fff;--paper-line:#d4d4d4;--paper-border:none;--paper-radius:0;
  --paper-shadow:0 0 0 1px rgba(0,0,0,.08),0 6px 24px rgba(0,0,0,.15);
  --switch-off:#b3b3b3;--modal-bg:#fff;--overlay:rgba(0,0,0,.35);--ok:#2d9d78;--warn:#e68619;--danger:#d7373f;
  color-scheme:light}
[data-theme="github"]{
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
  --bg:#f6f8fa;--chrome:#f6f8fa;--chrome2:#fff;--panel:#fff;--line:#d1d9e0;--border:#d1d9e0;--hover:#eaeef2;
  --text:#1f2328;--dim:#59636e;--strong:#1f2328;--accent:#0969da;--accent2:#0969da;--on-accent:#fff;
  --cta:#1f883d;--cta-hover:#1a7f37;--cta-radius:6px;--btn-radius:6px;--radius:6px;
  --editor-bg:#fff;--editor-fg:#1f2328;--selection:#b6e3ff;--input-bg:#f6f8fa;--input-border:#d1d9e0;
  --pane-head:#f6f8fa;--workarea:#f6f8fa;--workarea-dark:#d1d9e0;--dd-bg:#fff;--dd-border:#d1d9e0;
  --dd-hover-bg:#eaeef2;--dd-hover-fg:#1f2328;--card-bg:#fff;--card-border:#d1d9e0;--code-bg:#f6f8fa;
  --tab-bg:#f6f8fa;--tab-active:#fff;--tab-ind:inset 0 -2px #fd8c73;--dock-ind:#fd8c73;
  --seg-bg:#f6f8fa;--seg-active:#fff;--btn-active-bg:#fff;--btn-active-border:#d1d9e0;
  --thumb:#c8d1da;--thumb-hover:#afb8c1;--shadow:0 8px 24px rgba(140,149,159,.25);
  --paper-bg:#fff;--paper-line:#d1d9e0;--paper-border:1px solid #d1d9e0;--paper-radius:6px;--paper-shadow:none;
  --switch-off:#d1d9e0;--modal-bg:#fff;--overlay:rgba(31,35,40,.5);--ok:#1a7f37;--warn:#9a6700;--danger:#d1242f;
  color-scheme:light}
[data-theme="github-dark"]{
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
  --bg:#010409;--chrome:#010409;--chrome2:#0d1117;--panel:#0d1117;--line:#3d444d;--border:#3d444d;--hover:#262c36;
  --text:#f0f6fc;--dim:#9198a1;--strong:#fff;--accent:#4493f8;--accent2:#1f6feb;--on-accent:#fff;
  --cta:#238636;--cta-hover:#29903b;--cta-radius:6px;--btn-radius:6px;--radius:6px;
  --editor-bg:#0d1117;--editor-fg:#f0f6fc;--selection:rgba(56,139,253,.4);--input-bg:#0d1117;--input-border:#3d444d;
  --pane-head:#151b23;--workarea:#010409;--workarea-dark:#010409;--dd-bg:#151b23;--dd-border:#3d444d;
  --dd-hover-bg:#262c36;--dd-hover-fg:#f0f6fc;--card-bg:#151b23;--card-border:#3d444d;--code-bg:#0d1117;
  --tab-bg:#010409;--tab-active:#0d1117;--tab-ind:inset 0 -2px #f78166;--dock-ind:#f78166;
  --seg-bg:#0d1117;--seg-active:#262c36;--btn-active-bg:#262c36;--btn-active-border:#3d444d;
  --thumb:#3d444d;--thumb-hover:#656c76;--shadow:0 8px 24px rgba(1,4,9,.75);
  --paper-bg:#0d1117;--paper-line:#3d444d;--paper-border:1px solid #3d444d;--paper-radius:6px;--paper-shadow:none;
  --switch-off:#3d444d;--modal-bg:#151b23;--overlay:rgba(1,4,9,.7);--ok:#3fb950;--warn:#d29922;--danger:#f85149;
  color-scheme:dark}

/* App tile: dark fade in dark themes, light fade in light themes (also used for the window/taskbar icon, see native.js) */
:root{--tile-a:#5a4400;--tile-b:#e6b800}
[data-theme="light"],[data-theme="github"]{--tile-a:#e0a800;--tile-b:#ffe27a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:clip}
body{background:var(--bg);color:var(--text);font:12px/1.4 var(--font-ui);
  display:grid;grid-template-rows:32px 40px 1fr 24px;user-select:none}
input,textarea,select{user-select:text}
button{font:inherit;color:inherit}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:var(--thumb);border:3px solid transparent;background-clip:content-box;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background-color:var(--thumb-hover)}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}

/* Menu bar */
.menubar{display:flex;align-items:center;background:var(--chrome);border-bottom:1px solid var(--line);position:relative;z-index:50}
.logo{width:40px;height:32px;display:grid;place-items:center}
.logo span{width:22px;height:22px;border-radius:22.5%;background:linear-gradient(135deg,var(--tile-a),var(--tile-b));color:#fff;
  font-weight:800;font-size:10px;display:grid;place-items:center;letter-spacing:-.02em}
#menus{display:flex}
.menu{position:relative}
.menu>button{background:none;border:0;padding:0 10px;height:32px}
.menu>button:hover,.menu.open>button{background:var(--hover)}
.dropdown{display:none;position:absolute;top:32px;left:0;min-width:280px;background:var(--dd-bg);border:1px solid var(--dd-border);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:4px 0}
.menu.open .dropdown{display:block}
.dropdown button{display:grid;grid-template-columns:18px 1fr auto;align-items:center;width:100%;background:none;border:0;
  padding:5px 16px 5px 8px;text-align:left}
.dropdown button:hover{background:var(--dd-hover-bg);color:var(--dd-hover-fg)}
.dropdown kbd{color:var(--dim);font:inherit;padding-left:24px}
.dropdown button:hover kbd{color:inherit;opacity:.8}
.dropdown .chk{font-size:11px}
.dropdown hr{border:0;border-top:1px solid var(--dd-border);margin:4px 0}
.dropdown .dd-label{padding:6px 16px 2px 26px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.apptitle{flex:1;text-align:center;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px}
.cta{margin-right:10px;height:24px;padding:0 16px;border-radius:var(--cta-radius);border:0;background:var(--cta);color:var(--on-accent);font-weight:600}
.cta:hover{background:var(--cta-hover)}

/* Options bar */
.optbar{display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--chrome2);border-bottom:1px solid var(--line)}
.group{display:flex;align-items:center;gap:2px;padding:0 6px;border-right:1px solid var(--border)}
.group:last-child{border-right:0}
.spacer,.flex{flex:1}
.ibtn{height:28px;min-width:28px;padding:0 6px;background:none;border:1px solid transparent;border-radius:var(--radius);
  display:inline-grid;place-items:center}
.ibtn:hover{background:var(--hover)}
.ibtn.active{background:var(--btn-active-bg);border-color:var(--btn-active-border);color:var(--strong)}
.ibtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.g{font-size:15px;line-height:1}.serif{font-family:Georgia,"Times New Roman",serif}
select{background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:var(--radius);height:26px;padding:0 6px;font:inherit;outline:0}
select:focus,input:focus{border-color:var(--accent)}
.optlabel{color:var(--dim);margin-right:4px}
.seg{display:inline-flex;border:1px solid var(--input-border);border-radius:var(--radius);overflow:hidden}
.seg button{background:var(--seg-bg);border:0;border-right:1px solid var(--input-border);padding:0 12px;height:26px}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover)}
.seg button.active{background:var(--seg-active);color:var(--strong);font-weight:600}
.seg.small button{height:26px;padding:0 14px}

/* Buttons and fields */
.field-in{background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:var(--radius);height:26px;padding:0 8px;font:inherit;outline:0;width:200px}
.btn-sm{height:26px;padding:0 12px;border-radius:var(--btn-radius);border:1px solid var(--input-border);background:none}
.btn-sm:hover{background:var(--hover)}
.btn-sm.primary{background:var(--cta);border-color:var(--cta);color:var(--on-accent);font-weight:600}
.btn-sm.primary:hover{background:var(--cta-hover)}

/* Main layout */
.main{display:grid;grid-template-columns:44px 1fr auto;min-height:0;overflow:clip}
.tools{background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:1px;overflow-y:auto}
.tools .ibtn{width:34px;height:32px}
.tools .sep{width:22px;height:1px;background:var(--border);margin:4px 0;flex:none}
.center{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:clip}
.tabs{display:flex;height:30px;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs::-webkit-scrollbar{height:0}
.tab{display:flex;align-items:center;gap:7px;padding:0 6px 0 12px;border-right:1px solid var(--line);color:var(--dim);
  background:var(--tab-bg);min-width:130px;max-width:230px;cursor:default}
.tab:hover{color:var(--text)}
.tab.active{background:var(--tab-active);color:var(--strong);box-shadow:var(--tab-ind)}
.tab-ico{font-size:9px;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:3px;padding:0 3px}
.tab .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.dirty .name::after{content:" \25CF";color:var(--accent)}
.tab .x{background:none;border:0;width:20px;height:20px;border-radius:3px;font-size:10px;opacity:0}
.tab:hover .x,.tab.active .x{opacity:.8}.tab .x:hover{background:var(--hover);opacity:1}
.tab-new{background:none;border:0;width:30px;font-size:16px;color:var(--dim)}.tab-new:hover{color:var(--strong);background:var(--hover)}

/* Start screen (no document open) — same layout as PDF Studio */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--workarea);padding:24px;text-align:center}
.empty-state .big-tile{width:112px;height:112px;border-radius:22.5%;background:linear-gradient(135deg,var(--tile-a),var(--tile-b));display:grid;place-items:center;color:#fff;font-weight:800;font-size:44px;letter-spacing:-.03em;box-shadow:0 12px 32px rgba(224,168,02,240,.35)}
.empty-state h1{margin:0;font-size:22px;font-weight:650;color:var(--strong)}
.empty-state p{margin:0;color:var(--dim);font-size:13px;max-width:520px}
.empty-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.recent{display:flex;flex-direction:column;gap:2px;min-width:360px;max-width:560px;margin-top:8px;text-align:left}
.recent .sect{margin-bottom:4px}
.recent button{display:flex;gap:10px;align-items:center;background:none;border:0;border-radius:var(--radius);padding:7px 10px;text-align:left}
.recent button:hover{background:var(--hover)}
.recent small{color:var(--dim);margin-left:auto;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl}
.ibtn:disabled,.btn-sm:disabled,.cta:disabled,select:disabled{opacity:.35;pointer-events:none}
.dropdown button:disabled{opacity:.4}.dropdown button:disabled:hover{background:none;color:inherit}

/* Dock */
.dock{width:330px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.dock.hidden{display:none}
.dock-tabs{display:flex;background:var(--chrome);border-bottom:1px solid var(--line);height:30px;flex:none}
.dock-tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:0 11px;font-weight:600}
.dock-tabs button:hover{color:var(--text)}
.dock-tabs button.active{color:var(--strong);border-bottom-color:var(--dock-ind)}
.dock-body{flex:1;overflow:auto;padding:10px}
.dpanel{display:none}.dpanel.active{display:block}
.dtools{display:flex;gap:6px;margin-bottom:10px;position:sticky;top:-10px;background:var(--panel);padding:10px 0 6px;margin-top:-10px;z-index:2}
.dtools .field-in{flex:1;width:auto}
.sect{margin:12px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600}
.empty{color:var(--dim);padding:20px 8px;text-align:center;line-height:1.7}
.empty code{background:var(--code-bg);padding:1px 5px;border-radius:3px}
.psec{border-bottom:1px solid var(--border);padding:4px 2px 12px;margin-bottom:8px}
.psec-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600;margin:6px 0 8px}
.kv{display:flex;justify-content:space-between;padding:3px 0}.kv span{color:var(--dim)}.kv b{font-weight:500;color:var(--strong);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch{display:flex;align-items:center;gap:10px;margin:10px 0;cursor:pointer}
.switch input{display:none}
.switch span{width:26px;height:14px;border-radius:7px;background:var(--switch-off);position:relative;transition:.15s;flex:none}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked+span{background:var(--accent2)}
.switch input:checked+span::after{left:14px}
input[type=range]{width:100%;max-width:360px;accent-color:var(--accent)}

/* Status bar */
.status{display:flex;align-items:center;gap:16px;padding:0 10px;background:var(--chrome);border-top:1px solid var(--line);color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden}
.st-state::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}
.st-state.dirty::before{background:var(--warn)}
.zoom{display:flex;align-items:center}
.zoom button{background:none;border:0;color:var(--dim);height:22px;min-width:22px;border-radius:3px}
.zoom button:hover{background:var(--hover);color:var(--strong)}
#zVal{min-width:44px}

/* Overlays */
.toast{position:fixed;left:50%;bottom:40px;transform:translate(-50%,20px);background:var(--dd-bg);color:var(--strong);padding:8px 16px;border-radius:var(--radius);
  border:1px solid var(--dd-border);border-left:4px solid var(--accent);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:300}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-bg{position:fixed;inset:0;background:var(--overlay);display:none;place-items:center;z-index:200}
.modal-bg.show{display:grid}
.modal{width:min(640px,92vw);max-height:84vh;display:flex;flex-direction:column;background:var(--modal-bg);border:1px solid var(--dd-border);
  border-radius:calc(var(--radius) + 2px);box-shadow:var(--shadow)}
.modal.wide{width:min(860px,94vw);height:min(600px,88vh)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;font-size:16px;font-weight:600;color:var(--strong);border-bottom:1px solid var(--border)}
.modal-body{padding:16px 20px;overflow:auto;line-height:1.6;flex:1;min-height:0}
.modal.wide .modal-body{padding:0;overflow:hidden}
.modal-body table{width:100%;border-collapse:collapse}
.modal-body td{padding:4px 6px;border-bottom:1px solid var(--border)}
.modal-body td:last-child{text-align:right}
.modal-body kbd{background:var(--code-bg);border:1px solid var(--input-border);border-radius:3px;padding:1px 6px;font:11px Consolas,monospace}
.modal-body h4{margin:16px 0 6px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.modal-body a{color:var(--accent)}
.modal-foot{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
.modal-foot[hidden]{display:none}

/* Settings dialog */
.prefs{display:grid;grid-template-columns:180px 1fr;height:100%}
.prefs nav{border-right:1px solid var(--border);padding:12px 8px;background:var(--panel)}
.prefs nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;border-radius:var(--radius);margin-bottom:2px}
.prefs nav button:hover{background:var(--hover)}
.prefs nav button.active{background:var(--dd-hover-bg);color:var(--dd-hover-fg);font-weight:600}
.prefs section{padding:4px 26px 24px;overflow:auto}
.prefs h3{font-size:12px;font-weight:600;color:var(--strong);margin:20px 0 8px;display:flex;justify-content:space-between;max-width:360px}
.prefs h3 .val{color:var(--dim);font-weight:400}
.prefs .hint{color:var(--dim);margin:-2px 0 10px}
.wide-sel{width:280px}
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:560px}
.theme-card{padding:0;border:2px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card-bg);text-align:left;cursor:pointer}
.theme-card:hover{border-color:var(--dim)}
.theme-card.active{border-color:var(--accent)}
.theme-name{display:flex;justify-content:space-between;padding:8px 12px;font-weight:600;color:var(--strong)}
.theme-name span{color:var(--accent)}
.tc-mock{height:112px;display:grid;grid-template-rows:16px 1fr;background:var(--bg);pointer-events:none}
.tc-bar{background:var(--chrome);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:5px;padding:0 7px}
.tc-bar i{width:16px;height:4px;border-radius:2px;background:var(--dim);opacity:.7}
.tc-bar b{margin-left:auto;width:22px;height:8px;border-radius:4px;background:var(--cta)}
.tc-body{display:grid;grid-template-columns:14px 1fr 1fr 38px;min-height:0}
.tc-rail{background:var(--chrome);border-right:1px solid var(--line)}
.tc-ed{background:var(--editor-bg);padding:8px 7px}
.tc-ed i,.tc-paper i{display:block;height:3px;border-radius:2px;margin:5px 0}
.tc-ed i{background:var(--dim);opacity:.55}
.tc-pv{background:var(--workarea);padding:7px 7px 0}
.tc-paper{background:var(--paper-bg);height:100%;border-radius:2px 2px 0 0;padding:6px;border:var(--paper-border);border-bottom:0}
.tc-paper i{background:var(--paper-line)}
.tc-paper i:first-child{height:5px;width:60%;background:var(--accent)}
.tc-dock{background:var(--panel);border-left:1px solid var(--line)}
</style>

<!-- Plan Studio: today, timetable, homework, dates, subjects -->
<style>
body{grid-template-columns:minmax(0,1fr)}
.optbar{min-width:0;overflow:hidden}
.ctxbar{display:flex;align-items:center;min-width:0;flex:1 1 0;overflow-x:auto;scrollbar-width:none}
.ctxbar::-webkit-scrollbar{height:0}
.ctxbar .group{flex:none}
.tools .ibtn.view.active{background:var(--btn-active-bg);border-color:var(--btn-active-border);color:var(--strong)}
.view-main{flex:1;overflow:auto;background:var(--workarea);padding:22px 26px 40px;min-height:0}
.view-title{display:flex;align-items:baseline;gap:12px;margin:0 0 16px}
.view-title h1{margin:0;font-size:20px;font-weight:650;color:var(--strong)}
.view-title .sub{color:var(--dim)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.pcard{background:var(--card-bg);border:1px solid var(--card-border);border-radius:calc(var(--radius) + 4px);padding:12px 14px}
.pcard h2{margin:0 0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.pcard h2 .btn-sm{height:22px;font-size:11px;text-transform:none;letter-spacing:0}
.empty-s{color:var(--dim);padding:6px 2px;line-height:1.6}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:1px 8px 1px 6px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--radius);border:1px solid transparent;cursor:default}
.row:hover{background:var(--hover)}
.row.sel{border-color:var(--accent);background:var(--hover)}
.row .grow{flex:1;min-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{color:var(--dim);font-size:11.5px;white-space:nowrap}
.row.done .grow{text-decoration:line-through;color:var(--dim)}
.row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex:none;margin:0}
.lesson-time{width:84px;flex:none;color:var(--dim);font-variant-numeric:tabular-nums}
.lesson-no{width:20px;flex:none;color:var(--dim);text-align:right;font-weight:600}
.row.two-line{flex-direction:column;align-items:stretch;gap:3px}
.tl-main{display:flex;align-items:center;gap:8px;min-width:0}
.tl-main .badge{flex:none}
.row .tl-title{font-weight:600;color:var(--strong);white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.tl-sub{display:flex;align-items:center;gap:6px;min-width:0;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-indent{padding-left:24px}
.tl-subj{display:inline-flex;align-items:center;gap:4px;font-weight:600;flex:none}
.tl-subj i{width:7px;height:7px;border-radius:50%;flex:none}
.tl-type{font-weight:600;color:var(--text);flex:none}
.tl-sub>span:last-child:not(.tl-subj):not(.tl-type){overflow:hidden;text-overflow:ellipsis}
.tl-type.exam,.tl-type.test{color:var(--danger)}
.tl-sep{opacity:.6}
.tl-time{flex:none;color:var(--text);font-weight:600}
.row.now{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px;background:var(--hover);color:var(--text);white-space:nowrap}
.badge.red{background:color-mix(in srgb,var(--danger) 22%,transparent);color:var(--danger)}
.badge.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.badge.ok{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.group-h{margin:16px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.group-h.red{color:var(--danger)}
.quick{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 6px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:calc(var(--radius) + 4px);padding:10px}
.quick .field-in{height:28px}
.quick select,.quick input[type=date],.quick input[type=time]{height:28px;background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:var(--radius);padding:0 6px;font:inherit;outline:0}
.quick .title-in{flex:1 1 220px;width:auto}
input[type=date],input[type=time]{color-scheme:light dark}

/* Timetable */
.tt{border-collapse:separate;border-spacing:4px;width:100%;table-layout:fixed;min-width:640px}
.tt th{font-weight:600;color:var(--dim);padding:4px 2px;font-size:12px}
.tt th.today{color:var(--accent)}
.tt td.p{width:92px;color:var(--dim);font-size:11.5px;text-align:right;padding-right:8px;vertical-align:middle;font-variant-numeric:tabular-nums;line-height:1.3}
.tt td.p b{display:block;color:var(--text);font-size:13px}
.tt td.c{height:52px;border-radius:calc(var(--radius) + 2px);border:1px dashed var(--border);vertical-align:top;padding:5px 7px;cursor:pointer;overflow:hidden}
.tt td.c:hover{border-color:var(--dim)}
.tt td.c.full{border-style:solid}
.tt td.c.sel{outline:2px solid var(--accent);outline-offset:1px}
.tt td.c.now{box-shadow:inset 0 0 0 2px var(--accent)}
.tt td.c .n{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tt td.c .r{font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tt tr.brk td{height:auto;padding:0;border:0}
.tt td.c.span{height:auto}
.tt th .dt{display:block;font-weight:400;font-size:11px;opacity:.8}
.tt td.c.off{border:0;cursor:default;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--hover) 6px 8px);opacity:.6}
.tt td.c.slot{border-style:dashed;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.tt td.c.slot .n{color:var(--accent)}
.tt td.c .ev{display:block;margin-top:3px;font-size:11px;padding:1px 5px;border-radius:5px;background:var(--hover);color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tt td.c .ev:hover{outline:1px solid var(--accent)}
.tt td.c .ev.mark{display:inline-block;margin-right:3px;font-weight:600;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.tt td.c .ev.mark.exam,.tt td.c .ev.mark.test{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.tt tr.dates-row td.p{vertical-align:top;padding-top:6px}
.tt td.dd{vertical-align:top;padding:2px;border-radius:var(--radius);background:var(--hover);min-height:26px;position:relative}
.tt td.dd.today{box-shadow:inset 0 0 0 1px var(--accent)}
.tt td.dd .ev{display:block;margin:0 18px 3px 0;font-size:11px;padding:2px 5px;border-radius:5px;border-left:3px solid var(--dim);background:var(--card-bg,var(--bg));color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tt td.dd .ev:hover,.tt td.dd .ev.on{outline:1px solid var(--accent)}
.tt td.dd .ev.cal{cursor:default;opacity:.85}
.tt td.dd .ev.cal:hover{outline:0}
.tt td.dd .ev small{opacity:.75;font-variant-numeric:tabular-nums}
.tt td.dd .ev.exam b,.tt td.dd .ev.test b{color:var(--danger)}
.tt td.dd .dd-add{position:absolute;top:2px;right:2px;width:16px;height:16px;line-height:14px;padding:0;border:0;border-radius:4px;background:transparent;color:var(--dim);cursor:pointer;opacity:0;font-size:13px}
.tt td.dd:hover .dd-add,.tt td.dd .dd-add:focus{opacity:1}
.tt td.dd .dd-add:hover{background:var(--accent);color:#fff}
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-6px 0 12px}
.weeknav .meta{color:var(--dim)}
.chip.slot{background:transparent;border:1px dashed var(--accent);color:var(--accent)}
.lesson-box{border:1px solid var(--card-border);border-radius:calc(var(--radius) + 2px);padding:8px 10px 2px;margin:10px 0;background:var(--card-bg)}
.lesson-box.active{border-color:var(--accent)}
.lb-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lb-h .flex{flex:1}
.term-checks{display:flex;flex-wrap:wrap;gap:4px 12px}
.term-checks label{display:flex;align-items:center;gap:5px;cursor:pointer}
.daylen{display:grid;grid-template-columns:max-content minmax(0,260px);gap:6px 12px;align-items:center}
.term-row{display:flex;align-items:center;gap:6px;margin:0 0 6px;flex-wrap:wrap}
.term-row .field-in{width:180px}
.tt td.c.hol{border:0;cursor:pointer;background:repeating-linear-gradient(45deg,transparent 0 6px,color-mix(in srgb,var(--warn) 14%,transparent) 6px 8px)}
.tt td.c .n.cancel{text-decoration:line-through;opacity:.6}
button.badge.wt{border:1px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer;font:inherit;font-size:11px;font-weight:600}
button.badge.wt:hover{background:var(--hover)}
.sub-sect{margin:8px 0 5px;font-size:11px;color:var(--dim);font-weight:600}
.tt td.c .n.opt{color:var(--dim);font-weight:500}
.wt-sel{height:24px;font-size:11.5px;background:var(--input-bg);color:var(--text);border:1px solid var(--accent);border-radius:9px;padding:0 6px}
.wt-sel.own{background:color-mix(in srgb,var(--accent) 18%,var(--input-bg))}
.gcard h2 .chip{font-size:12.5px}
.grow-row{display:flex;align-items:center;gap:10px;padding:6px 2px;border-top:1px solid var(--card-border)}
.grow-row:first-of-type{border-top:0}
.gcat{width:120px;flex:none;color:var(--dim);font-size:12px;line-height:1.3}
.gchips{flex:1;display:flex;flex-wrap:wrap;gap:5px}
.gchip{min-width:30px;height:24px;padding:0 7px;border-radius:7px;border:1px solid var(--card-border);background:var(--hover);color:var(--strong);font:inherit;font-weight:650;cursor:pointer}
.gchip sub{font-size:9px;font-weight:500;margin-left:1px;color:var(--dim)}
.gchip:hover{border-color:var(--accent)}.gchip.sel{outline:2px solid var(--accent);outline-offset:1px}
.gchip.ok{background:color-mix(in srgb,var(--ok) 20%,transparent)}.gchip.warn{background:color-mix(in srgb,var(--warn) 22%,transparent)}.gchip.red{background:color-mix(in srgb,var(--danger) 22%,transparent)}
.calc{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.calc select,.calc input{height:28px;background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:var(--radius);padding:0 6px;font:inherit}
.calc-res{margin-top:10px;color:var(--strong);font-weight:600}
.tt td.c .cont{display:block;margin-top:3px;font-size:11px;padding:1px 5px;border-radius:5px;border:1px dashed var(--border);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tt td.c .cont small{opacity:.8}
.block-grid{border-collapse:separate;border-spacing:3px;width:auto!important}
.block-grid th,.block-grid td{border:0!important;padding:0 2px!important;background:none!important}
.block-grid th{font-weight:600;color:var(--dim);font-size:11.5px}
.block-grid td:first-child{color:var(--dim);font-size:11.5px;text-align:right;padding-right:6px}
.block-grid button{width:34px;height:20px;border-radius:5px;border:1px solid var(--input-border);background:var(--input-bg);cursor:pointer}
.block-grid button:hover{border-color:var(--accent)}
.block-grid button.on{background:color-mix(in srgb,var(--danger) 30%,var(--input-bg));border-color:var(--danger);color:var(--danger);font-size:11px;line-height:1}
.block-grid button.on::after{content:"✕"}
.room-changed{color:var(--warn);font-weight:700}
.sub-note{color:var(--warn);font-weight:600}
.tt td.c .r.sub-note{white-space:normal;opacity:1}
.day-rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.day-rooms label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--dim)}
.day-rooms .field-in{width:100%;box-sizing:border-box;height:26px}
.prog{height:6px;border-radius:3px;background:var(--hover);overflow:hidden;margin:0 0 8px}.prog i{display:block;height:100%;background:var(--ok)}
.topics{display:flex;flex-direction:column;gap:2px;margin:0 0 6px}
.topic{display:flex;align-items:center;gap:6px}.topic label{flex:1;display:flex;gap:6px;align-items:center;cursor:pointer}
.topic input[type=checkbox]{accent-color:var(--accent)}
.x{border:0;background:none;color:var(--dim);cursor:pointer;font-size:14px;padding:0 4px}.x:hover{color:var(--danger)}
.sessions{display:flex;flex-direction:column;gap:2px;font-size:12px}
.sess{display:flex;gap:8px;align-items:center;padding:3px 0;border-top:1px solid var(--card-border)}.sess.done{opacity:.55;text-decoration:line-through}
.sess .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.study-bars{display:flex;flex-direction:column;gap:5px}
.sb-row{display:flex;align-items:center;gap:8px;font-size:12px}.sb-name{width:90px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-bar{flex:1;height:8px;border-radius:4px;background:var(--hover);overflow:hidden}.sb-bar i{display:block;height:100%}
.study-timer{position:fixed;right:18px;bottom:36px;z-index:200;width:220px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:0 10px 34px rgba(0,0,0,.35);text-align:center}
.study-timer.work{border-color:var(--accent)}.study-timer.rest{border-color:var(--ok)}
.st-phase{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600}
.st-time{font-size:34px;font-weight:700;color:var(--strong);font-variant-numeric:tabular-nums;margin:2px 0}
.st-what{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.st-btns{display:flex;gap:6px;justify-content:center}
.area-seg{display:inline-flex;border:1px solid var(--input-border);border-radius:var(--radius);overflow:hidden;margin:0 0 8px}
.area-seg button{border:0;background:none;padding:4px 10px;font:inherit;font-size:12px;color:var(--text);cursor:pointer}
.area-seg button+button{border-left:1px solid var(--input-border)}
.area-seg button.on{background:var(--accent);color:var(--on-accent,#fff)}
.pick-btns{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.btn-sm.on{border-color:var(--accent);color:var(--accent)}
details.more{margin:10px 0}
details.more summary{cursor:pointer;color:var(--dim);font-size:12px;margin-bottom:6px}
.warn-row{color:var(--warn)}
.agent-quick{display:flex;gap:6px;margin-top:8px}.agent-quick .field-in{flex:1;height:28px}
.row.warn-row{font-weight:600}
/* Learn: decks, card list, practice */
.deck-card{cursor:pointer}.deck-card:hover{border-color:var(--accent)}
/* Folders of decks: path at the top, folder cards, dragging a deck onto a folder */
.ico-f{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;vertical-align:-2px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:0 0 10px}
.crumb{background:none;border:1px dashed transparent;border-radius:var(--radius);color:var(--dim);font:inherit;padding:2px 6px;cursor:pointer}
.crumb:hover{color:var(--text);background:var(--hover)}.crumb.cur{color:var(--strong);font-weight:600}
.crumb-sep{color:var(--dim)}
.folder-card{border-style:dashed}.folder-card h2 span{display:flex;align-items:center;gap:5px}
.drop-on{border-color:var(--accent)!important;background:var(--hover)}.crumb.drop-on{border-style:dashed}
.dragging{opacity:.5}
/* Search over all decks */
.lsearch{display:flex;align-items:center;gap:6px;margin:0 0 12px;max-width:520px;color:var(--dim)}.lsearch .ico-f{width:16px;height:16px}
.lsearch .field-in{flex:1;height:30px}
.search-decks{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.search-deck{display:flex;align-items:center;gap:6px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);color:var(--text);font:inherit;padding:5px 9px;cursor:pointer}
.search-deck:hover{border-color:var(--accent)}
.search-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.search-table tr[data-hit]{cursor:pointer}.search-table tr[data-hit]:hover td{background:var(--hover)}
.search-table td{padding:6px;overflow-wrap:anywhere}.search-table td.meta{white-space:normal;max-width:220px}.search-table td.meta:last-child{white-space:nowrap}
mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.hit-row td{background:color-mix(in srgb,var(--accent) 14%,transparent);transition:background 1.5s}
.pcard h2>span{display:flex;gap:6px;align-items:center}
.deck-name{font-size:15px;font-weight:650;color:var(--strong);margin:0 0 4px;overflow-wrap:anywhere}
.boxbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--hover);margin-top:8px;flex:1 1 120px;min-width:80px}
.boxbar i{display:block;height:100%}.boxbar .b-known{background:var(--ok)}.boxbar .b-learn{background:var(--accent)}.boxbar .b-new{background:var(--dim);opacity:.45}
.learn-go .boxbar{margin:0 0 0 8px}
.learn-go select{height:28px;background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:var(--radius);padding:0 6px;font:inherit}
.boxdots{display:inline-flex;gap:2px;vertical-align:middle;margin-right:4px}.boxdots i{width:6px;height:6px;border-radius:50%;background:var(--hover);border:1px solid var(--border)}
.boxdots i.on{background:var(--ok);border-color:var(--ok)}
.ctable{width:100%;border-collapse:collapse;margin-top:8px}
.ctable th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:8px 6px 4px}
.ctable td{padding:2px 4px;border-top:1px solid var(--card-border)}.ctable td.meta{white-space:nowrap;color:var(--dim);font-size:11.5px;width:1%}
.cin{width:100%;box-sizing:border-box;background:transparent;border:1px solid transparent;border-radius:var(--radius);color:var(--text);font:inherit;height:28px;padding:0 6px;outline:0}
.cin:hover{border-color:var(--border)}.cin:focus{border-color:var(--accent);background:var(--input-bg)}
.drill{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.drill-top{display:flex;align-items:center;gap:8px}.drill-top .grow{flex:1;display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;color:var(--strong)}
.drill .prog{margin:0}
.flash{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:28px 32px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.flash.turn{cursor:pointer}.flash.turn:hover{border-color:var(--accent)}
.flash.done .prog{width:60%;margin:6px 0}
.fl-side{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.fl-q{font-size:26px;font-weight:650;color:var(--strong);white-space:pre-wrap;overflow-wrap:anywhere}
.fl-a{font-size:22px;color:var(--accent);font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.fl-line{width:60%;border-top:1px dashed var(--border);margin:14px 0 8px}
.fl-typed{font-size:20px;font-weight:600}.fl-typed.right{color:var(--ok)}.fl-typed.almost{color:var(--warn)}.fl-typed.wrong{color:var(--danger);text-decoration:line-through}
.fl-verdict{font-weight:600}.fl-verdict.right{color:var(--ok)}.fl-verdict.almost{color:var(--warn)}.fl-verdict.wrong{color:var(--danger)}
.fl-stats{display:flex;gap:8px;justify-content:center;margin:6px 0}
.drill-in{width:min(420px,100%);height:36px;font-size:16px;text-align:center;margin-top:4px}
.drill-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.drill-btns .btn-sm{height:34px;padding:0 18px;font-size:13px}
.drill-btns kbd,.choice kbd{font:inherit;font-size:10.5px;opacity:.7;border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-left:6px}
.btn-sm.yes{border-color:var(--ok);color:var(--ok)}.btn-sm.no{border-color:var(--danger);color:var(--danger)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:4px}
.choice{display:flex;align-items:center;gap:8px;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.choice:hover{border-color:var(--accent)}.choice kbd{margin:0}.choice:disabled{opacity:1;pointer-events:none}
.choice.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}.choice.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 18%,transparent)}
.import-text{width:100%;box-sizing:border-box;min-height:220px;background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:var(--radius);padding:8px;font:12.5px ui-monospace,Menlo,monospace;outline:0;resize:vertical}
.import-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.rule{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rule input[type=number]{width:56px}
.rule .field-in{width:150px}
.daylen input,.rule input,.rule select{height:26px;background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:var(--radius);padding:0 6px;font:inherit}

/* Dock editor */
.ed-field{margin:0 0 10px}
.ed-field label{display:block;color:var(--dim);margin-bottom:4px}
.ed-field .field-in,.ed-field select,.ed-field input[type=date],.ed-field input[type=time],.ed-field textarea{width:100%;box-sizing:border-box;height:28px;background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:var(--radius);padding:0 8px;font:inherit;outline:0}
.ed-field textarea{height:90px;padding:6px 8px;resize:vertical;line-height:1.5}
.ed-field .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.palette button{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:var(--radius);border:1px solid var(--card-border);background:var(--card-bg);text-align:left;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.palette button:hover{border-color:var(--accent)}
.palette button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.palette i{width:12px;height:12px;border-radius:3px;flex:none}
.colors{display:flex;flex-wrap:wrap;gap:6px}
.colors button{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--border);cursor:pointer;padding:0}
.colors button.on{box-shadow:0 0 0 2px var(--accent)}
.periods{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center;max-width:360px}
.daylen select,.term-row input,.periods input{height:26px;background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:var(--radius);padding:0 6px;font:inherit}
.danger-btn{color:var(--danger)}

@media print{
  html,body{height:auto;overflow:visible;display:block;background:#fff;color:#000}
  .menubar,.optbar,.tools,.dock,.status,.toast,.modal-bg{display:none!important}
  .main,.center{display:block!important;overflow:visible!important}
  .view-main{overflow:visible;background:#fff;padding:0}
  .tt td.dd .dd-add{display:none}
  .tt td.c{border-color:#ccc!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .view-title h1{color:#000}
}
</style>
